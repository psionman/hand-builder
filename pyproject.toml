[project]
name = "hand_builder"
version = "0.0.0"
description = "Hand builder"
authors = [
    {name = "Jeff Watkins", email = "jeffwatkins2000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bridgeobjects>=0.1.35",
    "clipboard>=0.0.4",
    "dotenv>=0.9.9",
    "psiconfig>=0.0.16",
    "psiutils>=1.0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "jedi>=0.19.2",
    "ruff>=0.11.0",
]

[build-system]
requires = ['uv-build']
build-backend = 'uv_build'

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.uv.sources]
psiutils = { path = "../../psi-utilities/psiutils", editable = true }
